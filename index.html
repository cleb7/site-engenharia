<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engenharia</title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <!-- Não precisa editar este arquivo: os textos ficam em conteudo.js -->

  <header class="header" id="header">
    <div class="container header-inner">
      <a href="#inicio" class="logo" id="logo"></a>
      <nav class="nav" id="nav">
        <a href="#servicos">Serviços</a>
        <a href="#processo">Como trabalhamos</a>
        <a href="#engenheiro">Sobre</a>
        <a href="#depoimentos" data-secao="depoimentos">Clientes</a>
        <a href="#faq">Dúvidas</a>
        <a href="#contato" class="btn btn-primary btn-sm">Orçamento</a>
      </nav>
      <button class="menu-toggle" aria-label="Abrir menu" id="menu-toggle">☰</button>
    </div>
  </header>

  <section class="hero" id="inicio">
    <div class="container hero-grid">
      <div class="hero-text">
        <span class="selo" id="banner-selo"></span>
        <h1 id="banner-titulo"></h1>
        <p id="banner-texto"></p>
        <div class="hero-buttons">
          <a href="#servicos" class="btn btn-primary" id="banner-botao1"></a>
          <a class="btn btn-outline" data-whats target="_blank" rel="noopener" id="banner-botao2"></a>
        </div>
        <ul class="hero-destaques" id="banner-destaques"></ul>
      </div>
      <div class="hero-img" id="hero-img"><div class="blueprint"></div></div>
    </div>
  </section>

  <section class="servicos" id="servicos">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Serviços</span>
        <h2 id="servicos-titulo"></h2>
        <p id="servicos-texto"></p>
      </div>
      <div class="servicos-lista" id="servicos-lista"></div>
    </div>
  </section>

  <section class="processo" id="processo">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Processo</span>
        <h2 id="processo-titulo"></h2>
      </div>
      <ol class="etapas" id="processo-lista"></ol>
    </div>
  </section>

  <section class="numeros">
    <div class="container numeros-grid" id="numeros-lista"></div>
  </section>

  <section class="engenheiro" id="engenheiro">
    <div class="container eng-grid">
      <div class="eng-foto" id="eng-foto"><span>Foto</span></div>
      <div>
        <span class="eyebrow" id="eng-titulo"></span>
        <h2 id="eng-nome"></h2>
        <p class="eng-cargo" id="eng-cargo"></p>
        <p id="eng-texto"></p>
        <ul class="check" id="eng-formacao"></ul>
      </div>
    </div>
  </section>

  <section class="diferenciais">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Diferenciais</span>
        <h2 id="dif-titulo"></h2>
      </div>
      <div class="dif-grid" id="dif-lista"></div>
    </div>
  </section>

  <section class="clientes" id="clientes">
    <div class="container">
      <p class="clientes-titulo" id="clientes-titulo"></p>
      <div class="logos" id="clientes-lista"></div>
    </div>
  </section>

  <section class="depoimentos" id="depoimentos">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Depoimentos</span>
        <h2 id="dep-titulo"></h2>
      </div>
      <div class="dep-grid" id="dep-lista"></div>
    </div>
  </section>

  <section class="faq" id="faq">
    <div class="container faq-grid">
      <div class="section-head">
        <span class="eyebrow">Dúvidas</span>
        <h2 id="faq-titulo"></h2>
      </div>
      <div id="faq-lista"></div>
    </div>
  </section>

  <section class="contato" id="contato">
    <div class="container contato-grid">
      <div>
        <h2 id="contato-titulo"></h2>
        <p id="contato-texto"></p>
        <ul class="contato-info" id="contato-info"></ul>
      </div>
      <form class="form" id="form">
        <label>Nome<input name="nome" required /></label>
        <label>Telefone / WhatsApp<input name="telefone" required /></label>
        <label>Serviço
          <select name="servico" id="form-servico"></select>
        </label>
        <label>Mensagem<textarea name="mensagem" rows="4"></textarea></label>
        <button class="btn btn-primary" type="submit">Enviar pelo WhatsApp</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <div id="footer-logo" class="logo logo-claro"></div>
      <span id="footer-texto"></span>
      <div class="footer-links" id="footer-links"></div>
    </div>
  </footer>

  <a class="whats-float" data-whats target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
  </a>

  <script src="conteudo.js?v=2"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
